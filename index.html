<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiServicios Ciudad - Delivery & Mandados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🛵 TuServicioLocal</h1>
        <p>Todo lo que necesitas en tu ciudad, a un clic</p>
    </header>

    <main class="container">
        <!-- Selección de Servicio -->
        <section class="card">
            <h2>¿Qué necesitas hoy?</h2>
            <div class="service-grid">
                <button class="service-btn active" onclick="selectService('super')">🛒 Supermercado</button>
                <button class="service-btn" onclick="selectService('delivery')">🛵 Moto Delivery</button>
                <button class="service-btn" onclick="selectService('mandados')">📋 Mandados</button>
                <button class="service-btn" onclick="selectService('servicios')">💳 Pago Servicios</button>
                <button class="service-btn" onclick="selectService('turnos')">📅 Turnos</button>
            </div>
        </section>

        <!-- Formulario dinámico de Solicitud -->
        <section class="card">
            <h2 id="formTitle">Pedido de Supermercado</h2>
            <form id="orderForm">
                
                <!-- Campo Dinámico según el servicio -->
                <div id="dynamicFields">
                    <label for="details">Lista de Compras / Productos del Supermercado:</label>
                    <textarea id="details" rows="4" placeholder="Ej: 1 litro de leche, 2 kg de manzanas, pan lactal..." required></textarea>
                </div>

                <label for="address">Dirección de Entrega:</label>
                <input type="text" id="address" placeholder="Ej: Calle 123 #45-67" required>

                <!-- Programación de Fecha y Horario -->
                <div class="time-schedule">
                    <div>
                        <label for="deliveryDate">Fecha de Entrega:</label>
                        <input type="date" id="deliveryDate" required>
                    </div>
                    <div>
                        <label for="deliveryTime">Horario Preferido:</label>
                        <select id="deliveryTime" required>
                            <option value="">Selecciona un horario</option>
                            <option value="Lo antes posible">Lo antes posible (Express)</option>
                            <option value="09:00 - 11:00 AM">Mañana (09:00 - 11:00 AM)</option>
                            <option value="11:00 - 01:00 PM">Mediodía (11:00 - 01:00 PM)</option>
                            <option value="04:00 - 06:00 PM">Tarde (04:00 - 06:00 PM)</option>
                            <option value="06:00 - 08:00 PM">Noche (06:00 - 08:00 PM)</option>
                        </select>
                    </div>
                </div>

                <label for="phone">Teléfono de Contacto / WhatsApp:</label>
                <input type="tel" id="phone" placeholder="Ej: +54 9 11 1234-5678" required>

                <button type="submit" class="submit-btn">Confirmar y Enviar Pedido</button>
            </form>
        </section>

        <!-- Lista de Pedidos Solicitados -->
        <section class="card">
            <h2>Mis Pedidos Activos</h2>
            <div id="orderList">
                <p class="empty-msg">Aún no has realizado pedidos.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
